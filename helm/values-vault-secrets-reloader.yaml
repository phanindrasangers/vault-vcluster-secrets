# vault-secrets-reloader POC values
# Chart: oci://ghcr.io/bank-vaults/helm-charts/vault-secrets-reloader
#
# This is bank-vaults' OWN reloader (NOT stakater/reloader - an earlier draft of this repo
# used that instead, before checking; bank-vaults ships a purpose-built controller for
# exactly this job). It polls Vault directly for a new *version* of any KV secret used by a
# workload that opts in via the `secrets-reloader.security.bank-vaults.io/reload-on-secret-change: "true"`
# pod annotation (see examples/demo-deployment.yaml), and rolls that workload automatically
# when the version changes - no manual ConfigMap-touching trigger needed.
#
# vault-secrets-reloader runs on the HOST cluster and is a host-native pod, so it
# authenticates to Vault via the HOST-facing "kubernetes" auth mount (configured in
# scripts/01-install-vault.sh), NOT the vcluster-facing "kubernetes-vcluster-demo" mount
# that the actual demo workload uses. See README "Two Kubernetes auth mounts, on purpose".

# Do NOT set `volumes`/`volumeMounts` here even though the chart exposes them: the
# controller's own ClusterRole only grants `get` on Secrets (see templates/rbac.yaml in the
# chart) - it fetches VAULT_TLS_SECRET/VAULT_TLS_SECRET_NS via the Kubernetes API directly,
# it does not read a mounted file, so no volume is needed. Separately, chart v0.5.0's
# deployment.yaml has a real template bug: the volumes/volumeMounts blocks render without
# their parent `volumes:`/`volumeMounts:` key, producing invalid YAML if you set either one
# to anything non-empty. Filed as consistent with a fresh, unpatched 0.5.0 pull - check for
# a newer chart version before assuming this is still broken.
# Defaults are collectorSyncPeriod=30m / reloaderRunPeriod=1h - sane for production, far
# too slow to verify interactively. Shortened here for this POC; widen these back out
# before running this anywhere real, to keep the polling load on Vault reasonable.
collectorSyncPeriod: 30s
reloaderRunPeriod: 1m

env:
  VAULT_ROLE: "vault-secrets-reloader"
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  VAULT_TLS_SECRET: "vault-tls"
  VAULT_TLS_SECRET_NS: "vault"
  VAULT_AUTH_METHOD: "kubernetes"
  VAULT_PATH: "kubernetes"
