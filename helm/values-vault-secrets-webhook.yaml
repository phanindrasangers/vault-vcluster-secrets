# vault-secrets-webhook POC values
# Chart: oci://ghcr.io/bank-vaults/helm-charts/vault-secrets-webhook

# Single replica is fine for a POC; the chart defaults to 2 for HA of the admission path.
replicaCount: 1

# certificate.generate (default true) makes the webhook mint its own CA/cert for the
# admission server's TLS - this is unrelated to Vault's own TLS cert (that one comes from
# the vault-operator and is distributed via `caNamespaces` in helm/vault-cr.yaml). No
# override needed here.
