# A SECOND vault-secrets-reloader release, installed INSIDE the vcluster (not on the
# host). See README "A reloader per vcluster, not one on the host" for why this is
# necessary: this controller watches Deployments/StatefulSets/DaemonSets, and vcluster
# does not sync those objects to the host - only the Pods they produce. A host-level
# reloader physically cannot see a Deployment that only exists inside a vcluster's own
# API server, so each vcluster with Vault-consuming workloads needs its own instance.
#
# This one authenticates through the SAME vcluster-facing "kubernetes-vcluster-demo" auth
# mount used by the demo workload itself, via its own dedicated role/ServiceAccount.
collectorSyncPeriod: 30s
reloaderRunPeriod: 1m

# This reloader's own in-cluster API calls (including its VAULT_TLS_SECRET lookup) go
# against the VCLUSTER's own API, not the host's - there is no "vault" namespace inside
# the vcluster's view. We mirror just the public CA cert (never the private key) into a
# "vault-tls" Secret in the vcluster's own "default" namespace for this to resolve - see
# README for the exact command.
env:
  VAULT_ROLE: "vault-secrets-reloader"
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  VAULT_TLS_SECRET: "vault-tls"
  VAULT_TLS_SECRET_NS: "default"
  VAULT_AUTH_METHOD: "kubernetes"
  VAULT_PATH: "kubernetes-vcluster-demo"
