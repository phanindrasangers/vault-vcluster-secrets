# Applied INSIDE the vcluster (virtual "default" namespace) - NOT on the host cluster:
#   vcluster connect demo -n vault-demo -- kubectl apply -f examples/demo-deployment.yaml
#
# This is the actual proof-of-concept workload: a pod that consumes a KV secret from the
# HOST cluster's Vault, injected by the vault-secrets-webhook running on the host, and kept
# fresh by vault-secrets-reloader (also running on the host) when the secret rotates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-demo-app
  template:
    metadata:
      labels:
        app: vault-demo-app
      annotations:
        vault.security.banzaicloud.io/vault-addr: "https://vault.vault.svc.cluster.local:8200"
        vault.security.banzaicloud.io/vault-role: "vcluster-demo"
        vault.security.banzaicloud.io/vault-path: "kubernetes-vcluster-demo"
        vault.security.banzaicloud.io/vault-skip-verify: "false"
        vault.security.banzaicloud.io/vault-tls-secret: "vault-tls"
        # Opts this Deployment into vault-secrets-reloader: it polls Vault for a new
        # version of any "vault:" secret referenced below and rolls this Deployment
        # automatically when one shows up. See README "Rotating the demo secret".
        secrets-reloader.security.bank-vaults.io/reload-on-secret-change: "true"
    spec:
      serviceAccountName: vault-reader
      # The vcluster's own CoreDNS has no record for "vault.vault.svc.cluster.local" -
      # that namespace/service only exist on the HOST, not inside this virtual cluster's
      # view. Pinning it to Vault's ClusterIP here keeps the hostname used by the
      # vault-addr annotation (and by Vault's server cert SANs, so TLS verification still
      # passes) resolvable without needing skip-verify. See README "Why hostAliases" for
      # the tradeoff (this IP must be refreshed if the host's `vault` Service is ever
      # deleted and recreated) and the more robust alternative if that matters to you.
      hostAliases:
        - ip: "VAULT_CLUSTER_IP_PLACEHOLDER"
          hostnames:
            - "vault.vault.svc.cluster.local"
      containers:
        - name: demo-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Pod started at: $(date -u)"
              echo "DB_USERNAME=$DB_USERNAME"
              echo "DB_PASSWORD=$DB_PASSWORD"
              echo "Sleeping - 'kubectl logs' this pod any time to see the values above again."
              sleep infinity
          env:
            - name: DB_USERNAME
              value: "vault:secret/data/vcluster-demo/db#username"
            - name: DB_PASSWORD
              value: "vault:secret/data/vcluster-demo/db#password"
